<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZimScope — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style> * { transition: none !important; animation: none !important; } </style>
</head>
<body class="bg-white text-slate-800">

<header class="border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-emerald-900 flex items-center justify-center text-white font-bold rounded">Z</div>
      <span class="font-semibold text-lg text-slate-800">ZimScope Admin</span>
    </div>
    <button id="admin-logout-btn" class="text-sm font-medium text-slate-600 border border-slate-300 rounded px-3 py-1 hover:border-emerald-900">Log out</button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8">

  <!-- LOGIN GATE -->
  <section id="admin-gate" class="max-w-md mx-auto mt-8">
    <h1 class="text-2xl font-semibold text-slate-800 mb-1">Admin log in</h1>
    <p class="text-sm text-slate-500 mb-6">
      Admin accounts are created the same way as student accounts (Firebase Auth),
      then given the "admin" role directly in the Firestore <code>users</code> collection.
      See SETUP.md for the exact steps.
    </p>
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="admin-email" type="email" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline focus:outline-2 focus:outline-amber-600" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="admin-password" type="password" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline focus:outline-2 focus:outline-amber-600" />
      </div>
      <div id="admin-login-error" class="hidden text-sm text-red-700 border border-red-200 bg-red-50 rounded px-3 py-2"></div>
      <button type="submit" class="w-full bg-emerald-900 text-white rounded px-4 py-2 font-medium hover:bg-emerald-800">Log in</button>
    </form>
  </section>

  <!-- ADMIN PANEL -->
  <section id="admin-panel" class="hidden">
    <h1 id="form-mode-label" class="text-2xl font-semibold text-slate-800 mb-6">Post new lesson</h1>

    <form id="content-form" class="border border-slate-200 rounded p-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Grade</label>
          <select id="content-grade" class="w-full border border-slate-300 rounded px-3 py-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
          <select id="content-subject" class="w-full border border-slate-300 rounded px-3 py-2"></select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Topic label</label>
        <input id="content-topic" type="text" placeholder="e.g. Place value" class="w-full border border-slate-300 rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Lesson title</label>
        <input id="content-title" type="text" required class="w-full border border-slate-300 rounded px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Lesson content</label>
        <textarea id="content-body" rows="8" required placeholder="Separate paragraphs with a blank line." class="w-full border border-slate-300 rounded px-3 py-2"></textarea>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-slate-700">Assessment questions</label>
          <button type="button" id="add-quiz-row-btn" class="text-sm text-emerald-900 font-medium border border-emerald-900 rounded px-2 py-1">Add question</button>
        </div>
        <div id="quiz-builder"></div>
      </div>

      <div id="content-status" class="hidden text-sm rounded px-3 py-2 border border-slate-200"></div>

      <div class="flex gap-3">
        <button id="content-submit-btn" type="submit" class="bg-emerald-900 text-white rounded px-4 py-2 font-medium hover:bg-emerald-800">Post lesson</button>
        <button id="content-cancel-btn" type="button" class="border border-slate-300 rounded px-4 py-2 font-medium text-slate-600 hover:border-slate-500">Clear form</button>
      </div>
    </form>

    <h2 class="text-xl font-semibold text-slate-800 mt-10 mb-4">Posted lessons</h2>
    <div id="content-list" class="border border-slate-200 rounded divide-y divide-slate-200 p-2"></div>
  </section>

</main>

<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
